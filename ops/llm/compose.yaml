# Local LLM stack (llama.cpp + LiteLLM) mirrored from the host's
# /srv/llm/compose.yaml. qwen was removed; images are pinned by digest.
# Secrets stay in /srv/llm/.env (never committed) — see .env.example.
services:
  main:
    # Chat model for Companion (LiteLLM `local-chat`). Source:
    # huihui-ai/Huihui-Ornith-1.5-35B-A3B-abliterated, GGUF by mradermacher
    # i1-Q4_K_M (21,713,463,808 bytes). Measured on the P40 (2026-10-22):
    # 20.8 GiB VRAM @ 16k, decode ~61 tok/s, prefill ~961 tok/s @ 6k;
    # thinking on/off gives the same decode rate.
    # 2026-10-26 P40: 65536 ctx q8_0 KV. Must be >= the pi-orch guest
    # contextWindow (65536) so the guest's own compaction kicks in before
    # llama.cpp rejects the request; 49152 overflowed in a real trial after
    # ~7 turns. Guest needs ~17k tokens of system+tools too, so 16k was out
    # (rejected at 17,026). At 49152 q8_0 measured GPU0 21.0/24.0 GiB,
    # prefill ~557 tok/s @20k, decode 59 tok/s short / 32 tok/s @20k.
    image: ghcr.io/ggml-org/llama.cpp@sha256:f88fa8d94d872312a4ad117acd490fa997bef81f03f161f0cfe0d74272e5b5bb
    container_name: huihui-ornith-35b
    restart: unless-stopped
    environment:
      LLAMA_API_KEY: ${LLAMA_API_KEY}
    volumes:
      - /srv/models/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    command:
      - -m
      - /root/.cache/huggingface/huihui-ornith-35b/Huihui-Ornith-1.5-35B-A3B-abliterated.i1-Q4_K_M.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -c
      - "65536"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --n-gpu-layers
      - "99"
      - -fa
      - "on"
      - --jinja
      # This model is hybrid (recurrent/Mamba-like state), so prefix reuse
      # needs context checkpoints. The default 8192 spacing produced none for
      # a ~17k system+tools guest prompt, and every trial-guest turn
      # re-prefilled ~18k tokens (~30s; 66s under contention) per llama.cpp
      # b11541 logs. 1024 keeps up to 32 checkpoints (default --ctx-checkpoints)
      # inside the 65536 window while still bounding checkpoint memory.
      - --checkpoint-min-step
      - "1024"
      # Bound concurrency to 2 slots: abandoned relay requests kept running
      # (60s relay timeout, LiteLLM retried 2x), filling 3-4 slots and
      # overflowing the shared 65k KV pool ("Context size has been exceeded").
      # --kv-unified is required because setting --parallel explicitly makes
      # llama.cpp split -c across slots (2 x 32768) instead of the shared pool,
      # which would reject the guest's 65536 contextWindow.
      - --parallel
      - "2"
      - --kv-unified
      # Cap thinking so one turn cannot burn the whole step budget. Measured
      # 2026-10-23 on 8 Companion-like prompts: unlimited 8/8 valid, reasoning
      # max 1251 chars, completion max 911 tokens; budget 512 8/8 valid,
      # completion p50 458; budget 256 8/8 valid. Production before the switch:
      # completion p90 1454 / max 2298 tokens, step p90 82.7s, 1
      # model_step_timeout. The message is injected before the end-of-thinking
      # tag when the budget is exhausted, so the model ends thinking naturally.
      - --reasoning-budget
      - "512"
      - --reasoning-budget-message
      - "\n\n考えはここまで。回答します。\n"
      - --alias
      - huihui-ornith-35b
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
    stop_grace_period: 30s

  ornith:
    # Maintenance LLM for remind (importance / topics / consolidation),
    # called directly on loopback by remind. Not registered in LiteLLM.
    # Shares the pinned llama.cpp build with main.
    image: ghcr.io/ggml-org/llama.cpp@sha256:f88fa8d94d872312a4ad117acd490fa997bef81f03f161f0cfe0d74272e5b5bb
    container_name: ornith-1.5-9b
    restart: unless-stopped
    volumes:
      # Host GGUF dir; ~/models/ornith on the current host. Override with
      # ORNITH_MODEL_DIR when the file lives elsewhere.
      - ${ORNITH_MODEL_DIR:-${HOME}/models/ornith}:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # Quadro P5000. main pins by index, so follow the same style;
              # index 1 is the P5000 on this host.
              device_ids: ["1"]
              capabilities: [gpu]
    command:
      - -m
      - /models/Ornith-1.5-9B-Q5_K_M.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -c
      - "8192"
      - -ngl
      - "99"
      - -fa
      - "on"
      - --jinja
      - --alias
      - ornith-1.5-9b
    ports:
      # Loopback only: remind calls http://127.0.0.1:18090 directly.
      - "127.0.0.1:18090:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
    stop_grace_period: 30s

  litellm:
    image: docker.litellm.ai/berriai/litellm@sha256:3d88bd757134a00e8c00237b85a021ab1f6d54abb9c1df750f411dbe7256a500
    container_name: litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    environment:
      LLAMA_API_KEY: ${LLAMA_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    command:
      - --config
      - /app/config.yaml
      - --port
      - "4000"
    depends_on:
      main:
        condition: service_healthy

  searxng:
    # Self-hosted web-search backend for Companion (docs/plan/web_search_design.md).
    # Loopback bind only: 127.0.0.1:8888 — never exposed to the tailnet or LAN.
    image: docker.io/searxng/searxng@sha256:5ed0323b5f5f8701264ef65e239a2bd83cb57098f2b971fa30bf79c06eeae271
    container_name: searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng:/etc/searxng:ro
    environment:
      # The image resolves server.secret_key from SEARXNG_SECRET
      # (searxng settings_defaults: SettingsValue(environ_name='SEARXNG_SECRET')).
      # Always set at apply time by ops/llm/apply.sh into /srv/llm/.env.
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      # Skip entrypoint ownership fixes; /etc/searxng is a read-only volume.
      FORCE_OWNERSHIP: "false"
    healthcheck:
      # /healthz (NOT /health — /health does not succeed, see design doc).
      # The image ships neither curl nor wget; use python3 stdlib.
      test:
        - CMD-SHELL
        - python3 -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/healthz", timeout=5)'
