# Claude 自動 PR レビュー
# Based on: https://github.com/anthropics/claude-code-action/blob/v1.0.252/examples/pr-review-comprehensive.yml
# Docs: https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
#
# Required secret: CLAUDE_CODE_OAUTH_TOKEN (repository Actions secret).
# Generated by running `claude setup-token` locally (requires a Claude Pro or
# Max subscription). Uses the documented input claude_code_oauth_token.
#
# NOTE: pull_request workflows use the workflow file from the PR's merge ref.
# Auto review starts on stacked PRs (#42-#48) only after this file reaches
# each PR's base branch chain. After this is merged to master, comment
# '@claude review' on each stacked PR instead (claude.yml handles it).

name: Claude Auto Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-auto-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-review:
    # Skip drafts; only run for PRs from this repo (secrets are not available
    # to fork PRs, and untrusted code must not reach Claude).
    if: |
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude Auto Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR番号: ${{ github.event.pull_request.number }}

            このPRのコードレビューを行ってください。PRのブランチは既にカレントディレクトリにチェックアウトされています。

            レビュー観点(優先度順):
            1. **正確性のバグ**: ロジックの誤り、境界条件・エッジケースの見落とし、エラーハンドリングの欠落
            2. **セキュリティ**: 入力バリデーション、認可チェックの欠落、機密情報・秘密情報の扱い
            3. **データ損失リスク**: 永続化データの破壊・上書き・削除、マイグレーションの安全性
            4. **並行性**: レースコンディション、トランザクション分離、非同期処理の競合、冪等性
            5. **テスト不足**: 上記リスクの高いロジックに対するテストの欠落・不十分さ

            ルール:
            - 各指摘には具体的なファイル名と行番号(file:line 形式)を必ず明記すること
            - スタイル・フォーマット・命名などの些細な指摘(nitpick)はしないこと
            - 指摘には重要度(高/中/低)を付けること
            - 重大な問題が見つからない場合は、その旨を明確に報告すること

            具体的な問題はPRレビューのインラインコメントとして投稿してください。
            全体的な所見・サマリーはトップレベルのレビューコメントで報告してください。

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
