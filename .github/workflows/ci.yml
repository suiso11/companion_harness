name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # The full matrix runs on both OSes. Native containment (bwrap) is a
        # Linux-only provision step below; portable tests avoid blanket skips.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Checkout pinned real remind CLI source (live-test dependency)
        uses: actions/checkout@v4
        with:
          repository: suiso11/remind
          ref: a1f6cedd086963e09e1eba21e20a551fc7f798ec
          path: .ci/remind
          persist-credentials: false

      - name: Static check (whitespace errors in HEAD patch)
        shell: bash
        run: |
          if git rev-parse --verify -q HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git show --check --format= --no-renames HEAD
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build pinned remind CLI (real dependency, no models)
        shell: bash
        working-directory: .ci/remind
        run: |
          # onnxruntime-node's install script downloads native binaries, so
          # npm ci can hit transient registry/CDN timeouts. Retry up to 3
          # attempts with linear backoff, then build exactly once.
          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            if npm ci --no-audit --no-fund; then
              break
            fi
            if [ "$attempt" -eq "$attempts" ]; then
              echo "::error::npm ci failed after $attempts attempts"
              exit 1
            fi
            delay=$((attempt * 15))
            echo "::warning::npm ci attempt $attempt failed; retrying in ${delay}s"
            sleep "$delay"
          done
          npm run build

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Install Linux native containment runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor

          # Ubuntu restricts unprivileged user namespaces by default. Prefer a
          # distro AppArmor profile scoped to exactly /usr/bin/bwrap when one
          # is installed. This is runtime admission for the parent namespace,
          # not a guest waiver.
          profile=""
          for candidate in \
            /etc/apparmor.d/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap; do
            if [ -f "${candidate}" ]; then
              profile="${candidate}"
              break
            fi
          done
          restrict="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)"
          if [ -n "${profile}" ]; then
            sudo apparmor_parser --replace "${profile}"
            echo "Loaded distro AppArmor profile: ${profile}"
          elif [ "${restrict}" = "1" ]; then
            # Ubuntu 24.04 ships apparmor 4.0.1 but does not install an
            # official /usr/bin/bwrap profile. Load the reviewed ABI 4
            # backport from this repository on the disposable runner only.
            # The profile keeps the parent bwrap setup allowance and stacks
            # unpriv_bwrap on child exec, which audit-denies all capabilities.
            vendored="${GITHUB_WORKSPACE}/.github/apparmor/bwrap-userns-restrict"
            if [ ! -f "${vendored}" ]; then
              echo "::error::Ubuntu user namespaces are restricted, no distro /usr/bin/bwrap profile exists, and the vendored ABI4 fallback is missing."
              uname -a || true
              sysctl kernel.apparmor_restrict_unprivileged_userns || true
              cat /sys/module/apparmor/parameters/enabled 2>/dev/null || true
              ls -l /usr/bin/bwrap 2>/dev/null || true
              ls -l /etc/apparmor.d/bwrap* 2>/dev/null || true
              ls /usr/share/apparmor/extra-profiles/ 2>/dev/null || true
              exit 1
            fi
            sudo apparmor_parser --replace \
              -I /etc/apparmor.d \
              --base /etc/apparmor.d \
              "${vendored}"
            echo "Loaded CI-only ABI4 fallback AppArmor profile: ${vendored}"
          else
            echo "Unprivileged user-namespace restriction is inactive; no /usr/bin/bwrap profile load is needed."
          fi

      - name: Native bubblewrap containment preflight
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! /usr/bin/bwrap --ro-bind / / --unshare-net /bin/true; then
            echo "::error::Native /usr/bin/bwrap containment preflight failed."
            uname -a || true
            cat /proc/version 2>/dev/null || true
            cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || true
            cat /sys/module/apparmor/parameters/enabled 2>/dev/null || true
            ls -l /usr/bin/bwrap 2>/dev/null || true
            ls -l /etc/apparmor.d/bwrap* 2>/dev/null || true
            sudo aa-status 2>/dev/null || true
            exit 1
          fi

      - name: Test
        env:
          COMPANION_MEMORY_TEST_ENTRY: ${{ github.workspace }}/.ci/remind/dist/src/cli.js
          COMPANION_MEMORY_TEST_CONFIG_TEMPLATE: ${{ github.workspace }}/.ci/remind/memory.config.example.json
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned real remind CLI source (live-test dependency)
        uses: actions/checkout@v4
        with:
          repository: suiso11/remind
          ref: a1f6cedd086963e09e1eba21e20a551fc7f798ec
          path: .ci/remind
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build pinned remind CLI (real dependency, no models)
        shell: bash
        working-directory: .ci/remind
        run: |
          # onnxruntime-node's install script downloads native binaries, so
          # npm ci can hit transient registry/CDN timeouts. Retry up to 3
          # attempts with linear backoff, then build exactly once.
          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            if npm ci --no-audit --no-fund; then
              break
            fi
            if [ "$attempt" -eq "$attempts" ]; then
              echo "::error::npm ci failed after $attempts attempts"
              exit 1
            fi
            delay=$((attempt * 15))
            echo "::warning::npm ci attempt $attempt failed; retrying in ${delay}s"
            sleep "$delay"
          done
          npm run build

      - name: Install Playwright chromium (with OS deps)
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Linux native containment runtime (autodispatch sealed bridge)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor dbus-user-session

          # Same reviewed provisioning as the check job. The autodispatch
          # browser suite runs the REAL sealed bridge, so it needs the same
          # AppArmor admission for unprivileged bwrap.
          profile=""
          for candidate in \
            /etc/apparmor.d/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap; do
            if [ -f "${candidate}" ]; then
              profile="${candidate}"
              break
            fi
          done
          restrict="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)"
          if [ -n "${profile}" ]; then
            sudo apparmor_parser --replace "${profile}"
            echo "Loaded distro AppArmor profile: ${profile}"
          elif [ "${restrict}" = "1" ]; then
            vendored="${GITHUB_WORKSPACE}/.github/apparmor/bwrap-userns-restrict"
            if [ ! -f "${vendored}" ]; then
              echo "::error::Ubuntu user namespaces are restricted, no distro /usr/bin/bwrap profile exists, and the vendored ABI4 fallback is missing."
              exit 1
            fi
            sudo apparmor_parser --replace \
              -I /etc/apparmor.d \
              --base /etc/apparmor.d \
              "${vendored}"
            echo "Loaded CI-only ABI4 fallback AppArmor profile: ${vendored}"
          else
            echo "Unprivileged user-namespace restriction is inactive; no /usr/bin/bwrap profile load is needed."
          fi

          if ! /usr/bin/bwrap --ro-bind / / --unshare-net /bin/true; then
            echo "::error::Native /usr/bin/bwrap containment preflight failed."
            uname -a || true
            cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || true
            ls -l /usr/bin/bwrap 2>/dev/null || true
            sudo aa-status 2>/dev/null || true
            exit 1
          fi

      - name: Start user systemd bus (autodispatch sealed scope)
        shell: bash
        run: |
          user="$(id -un)"
          uid="$(id -u)"
          runtime="/run/user/${uid}"
          bus="unix:path=${runtime}/bus"
          sudo loginctl enable-linger "${user}"
          sudo systemctl start "user@${uid}.service" || true
          echo "XDG_RUNTIME_DIR=${runtime}" >> "${GITHUB_ENV}"
          echo "DBUS_SESSION_BUS_ADDRESS=${bus}" >> "${GITHUB_ENV}"
          export XDG_RUNTIME_DIR="${runtime}"
          export DBUS_SESSION_BUS_ADDRESS="${bus}"

          # Never fake systemd: require a real user manager + transient scope
          # before the suite starts, and fail with diagnostics instead.
          for attempt in $(seq 1 30); do
            if [ -S "${runtime}/bus" ] &&
               systemd-run --user --scope --quiet -p MemoryMax=64M true; then
              echo "user systemd scope ready for uid ${uid}"
              exit 0
            fi
            sleep 1
          done
          echo "::error::User systemd bus/scope unavailable on this runner."
          loginctl show-user "${user}" || true
          ls -ld "${runtime}" "${runtime}/bus" 2>/dev/null || true
          sudo journalctl -u "user@${uid}.service" --no-pager -n 100 || true
          exit 1

      - name: E2E typecheck (harness + spec + config)
        run: pnpm typecheck:e2e

      - name: Production UI build
        run: pnpm --filter @companion/server build:ui

      - name: Smoke E2E (chromium, real browser, temp DB only)
        run: pnpm --filter @companion/server test:e2e

      - name: Calendar + fake Action safety E2E (chromium, temp DB only)
        env:
          COMPANION_E2E_CALENDAR: "1"
        run: pnpm --filter @companion/server test:e2e

      - name: Memory management browser E2E (chromium, temp DB only)
        env:
          COMPANION_E2E_MEMORY: "1"
          COMPANION_MEMORY_TEST_ENTRY: ${{ github.workspace }}/.ci/remind/dist/src/cli.js
          COMPANION_MEMORY_TEST_CONFIG_TEMPLATE: ${{ github.workspace }}/.ci/remind/memory.config.example.json
        run: pnpm --filter @companion/server test:e2e

      - name: Auto-dispatch browser E2E (CI executor substitute, not installed pi-orch)
        env:
          COMPANION_E2E_AUTODISPATCH: "1"
          COMPANION_AD_E2E_MODE: "ci"
        run: |
          # Real server/UI/planner/materializer/TrialRunner/sealed bridge,
          # real systemd-user+bwrap confinement, real model relay. Only the
          # installed pi-orch/OMP executor is replaced by the repo-contained
          # scripts/pi-orch-bridge/ci-executor.mjs. Never evidence for the
          # installed binaries; local runs keep real-pi.
          timeout --signal=TERM --kill-after=30s 900s \
            pnpm --filter @companion/server test:e2e

      - name: Upload E2E failure artifacts (no production data)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: |
            apps/server/playwright-report/
            apps/server/test-results/
          if-no-files-found: ignore
